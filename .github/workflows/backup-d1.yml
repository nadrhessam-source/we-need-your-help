name: Backup D1 Database

on:
  schedule:
    # هر روز ساعت 10:00 UTC (یک ساعت بعد از Cron اصلی)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download backup
        env:
          BACKUP_TOKEN: ${{ secrets.WNYH_BACKUP_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          curl -sS -f \
            -H "Authorization: Bearer $BACKUP_TOKEN" \
            "https://api.we-need-your-help.xyz/api/admin/export" \
            -o "backup-$DATE.json"

          echo "Backup size:"
          ls -lh backup-*.json
          echo ""
          echo "Tables in backup:"
          python3 -c "
          import json
          with open('backup-$DATE.json') as f:
              data = json.load(f)
          for table, rows in data['data'].items():
              print(f'  {table}: {len(rows)} rows')
          "

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup-*.json
          retention-days: 90

      - name: Summary
        run: |
          echo "### Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "File size: $(ls -lh backup-*.json | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
