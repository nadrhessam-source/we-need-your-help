name: Daily Content & Video Generation

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Verify FFmpeg
        run: ffmpeg -version | head -3

      - name: Generate daily content
        run: node scripts/content-engine.js

      - name: Generate daily video
        run: node scripts/video-engine.js

      - name: Summary
        run: |
          echo "=== POST TEXT ==="
          cat tmp/post-*.txt
          echo ""
          echo "=== META ==="
          cat tmp/meta-*.json
          echo ""
          echo "=== VIDEO FILE ==="
          ls -lh tmp/video-*.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-${{ github.run_id }}
          path: |
            tmp/post-*.txt
            tmp/meta-*.json
            tmp/report-*.json
            tmp/video-*.mp4
          retention-days: 30

      - name: Commit video to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add daily video (run ${{ github.run_id }})"
          file_pattern: 'tmp/video-*.mp4 tmp/post-*.txt tmp/meta-*.json'
          branch: main
          commit_user_name: "WNYH Bot"
          commit_user_email: "bot@weneedyourhelp.local"
          commit_author: "WNYH Bot <bot@weneedyourhelp.local>"
