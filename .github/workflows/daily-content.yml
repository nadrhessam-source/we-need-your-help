name: Daily Content Generation

on:
  # اجرای زمان‌بندی‌شده — هر روز ساعت 9:00 UTC (12:30 تهران)
  schedule:
    - cron: '0 9 * * *'
  # امکان اجرای دستی از تب Actions
  workflow_dispatch:

# دسترسی برای نوشتن artifact
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate daily content
        id: content
        run: node scripts/content-engine.js

      - name: Show generated content
        run: |
          echo "=== Generated post ==="
          cat tmp/post-*.txt
          echo ""
          echo "=== Metadata ==="
          cat tmp/meta-*.json

      - name: Upload content artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-${{ github.run_id }}
          path: |
            tmp/post-*.txt
            tmp/meta-*.json
            tmp/report-*.json
          retention-days: 30
