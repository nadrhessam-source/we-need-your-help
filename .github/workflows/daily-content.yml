name: Daily Content & Video Generation

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate daily content
        run: node scripts/content-engine.js

      - name: Generate daily video
        run: node scripts/video-engine.js

      - name: Publish to social media
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/publish.js

      - name: Summary
        run: |
          echo "=== POST TEXT ==="
          cat tmp/post-*.txt
          echo ""
          echo "=== VIDEO ==="
          ls -lh tmp/video-*.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-content-${{ github.run_id }}
          path: |
            tmp/post-*.txt
            tmp/meta-*.json
            tmp/video-*.mp4
          retention-days: 30

      - name: Commit artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add daily content (run ${{ github.run_id }})"
          file_pattern: 'tmp/post-*.txt tmp/meta-*.json tmp/video-*.mp4'
          branch: main
          commit_user_name: "WNYH Bot"
          commit_user_email: "bot@weneedyourhelp.local"
