name: Daily Content & Video Generation

on:
  schedule:
    - cron: '0 9 * * *'   # هر روز 9:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg
        run: ffmpeg -version | head -3

      - name: Generate daily content
        run: node scripts/content-engine.js

      - name: Generate daily video
        run: node scripts/video-engine.js

      - name: Show generated content
        run: |
          echo "=== Post text ==="
          cat tmp/post-*.txt
          echo ""
          echo "=== Metadata ==="
          cat tmp/meta-*.json
          echo ""
          echo "=== Video info ==="
          ls -lh tmp/video-*.mp4

      - name: Upload content & video artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ github.run_id }}
          path: |
            tmp/post-*.txt
            tmp/meta-*.json
            tmp/report-*.json
            tmp/video-*.mp4
          retention-days: 30
